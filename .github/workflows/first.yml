name: First work-flow
on:
  push:
  pull_request:
    branches:
      - main
      - dev

jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: RUn Test Cases
        run: npm run test
      - name: Create build
        run: npm run build

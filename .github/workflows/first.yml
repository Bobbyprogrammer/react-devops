name: First work-flow
on:
  push:
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: RUn Test Cases
        run: npm run test

  build-job:
    needs: [lint-job, test-job]

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create build
        run: npm run build

      - name: Create Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/
          retention-days: 5
  deploy-job:
    needs: [lint-job, test-job, build-job]

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: vercel --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
